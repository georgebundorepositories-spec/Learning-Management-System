name: ZimSchool signed Android candidate
on:
  workflow_dispatch:
    inputs:
      accept_qa_build:
        description: 'I confirm this is a QA candidate, not a production rollout'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  signed-candidate:
    if: ${{ inputs.accept_qa_build == true }}
    runs-on: ubuntu-26.04
    environment: android-release
    timeout-minutes: 35
    env:
      ZIMLMS_SUPABASE_URL: https://mezbtcdkmvtkjxdmmhbw.supabase.co
      ZIMLMS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nlxCwwfA_MWEpI-3zX1hWg__PlUl91m

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check stable signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required signing secret: $var" >&2
              exit 1
            fi
          done
          echo "Signing configuration available (secret values never logged)"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build unsigned release
        working-directory: apps/android
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Sign candidate using the persistent owner keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/zimschool-release.jks"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          unsigned="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="apps/android/app/build/outputs/apk/release/ZimSchool-signed-qa-candidate.apk"
          test -s "$unsigned"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$signer"
          "$signer" sign --ks "$key_file" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          "$signer" verify --verbose --print-certs "$signed"
          test "$(stat -c%s "$signed")" -le 26214400
          {
            echo "### Signed Android QA candidate"
            echo "Artifact: ZimSchool-signed-qa-candidate"
            echo "APK SHA-256: $(sha256sum "$signed" | cut -d' ' -f1)"
            echo "This is not a production release. Real-device and privacy gates remain mandatory."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit signed APK before QA distribution
        run: python3 scripts/audit-android-apk.py apps/android/app/build/outputs/apk/release/ZimSchool-signed-qa-candidate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZimSchool-signed-qa-candidate
          path: apps/android/app/build/outputs/apk/release/ZimSchool-signed-qa-candidate.apk
          if-no-files-found: error
          retention-days: 30
