name: Android Phase 0 checks
on:
  # Avoid duplicate push + pull_request builds for the same development commit.
  # Main has push protection; active feature branches are checked through PRs.
  push:
    branches: [main]
    paths: ['apps/android/**', 'scripts/audit-android-apk.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'scripts/audit-android-apk.py', '.github/workflows/android.yml']
# Older pushes and draft-PR runs from the same branch should not consume
# multiple emulators while a newer commit is ready to validate.
concurrency:
  # One group per pull request; distinct from legacy push/PR groups to avoid
  # a previously cancelled run indefinitely occupying the same queue slot.
  group: zimschool-android-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Publishable keys are intentionally public; privileged secret keys are NEVER embedded.
    env:
      ZIMLMS_SUPABASE_URL: https://mezbtcdkmvtkjxdmmhbw.supabase.co
      ZIMLMS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nlxCwwfA_MWEpI-3zX1hWg__PlUl91m
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Check preliminary debug APK size (not release certification)
        run: |
          bytes=$(stat -c%s apps/android/app/build/outputs/apk/debug/app-debug.apk)
          echo "Debug APK bytes: $bytes"
          test "$bytes" -le 26214400
      - name: Audit debug APK for privileged credentials
        run: python3 scripts/audit-android-apk.py apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zimschool-phase0-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  minified-release-size:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZIMLMS_SUPABASE_URL: https://mezbtcdkmvtkjxdmmhbw.supabase.co
      ZIMLMS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nlxCwwfA_MWEpI-3zX1hWg__PlUl91m
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build optimised unsigned release APK (not distribution-ready)
        working-directory: apps/android
        run: gradle :app:assembleRelease --no-daemon
      - name: Enforce 25 MiB release APK budget
        run: |
          set -euo pipefail
          path=apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$path"
          size=$(stat -c%s "$path")
          echo "Unsigned release APK size: $size bytes"
          echo "Maximum permitted size: 26214400 bytes"
          test "$size" -le 26214400
      - name: Audit unsigned release APK for privileged credentials
        run: python3 scripts/audit-android-apk.py apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Preserve release-size evidence
        uses: actions/upload-artifact@v4
        with:
          name: zimschool-unsigned-minified-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  offline-auth-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration for emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Android emulator Keystore and offline PIN tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: apps/android
          script: gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Preserve device test results for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-pin-tests-api-${{ matrix.api-level }}
          path: |
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
