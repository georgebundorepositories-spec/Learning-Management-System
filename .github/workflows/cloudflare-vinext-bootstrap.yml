name: Bootstrap ZimSchool Cloudflare Workers with vinext
on:
  push:
    branches: [deploy/cloudflare-workers-vinext]
    paths: ['.github/workflows/cloudflare-vinext-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-cloudflare:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://mezbtcdkmvtkjxdmmhbw.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nlxCwwfA_MWEpI-3zX1hWg__PlUl91m
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Check vinext compatibility
        working-directory: apps/web
        run: npx --yes vinext@latest check
      - name: Initialize Cloudflare adapter with no shared caching of student data
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --yes vinext@latest init --platform=cloudflare \
            --cdn-cache=none --data-cache=none \
            --image-optimization=none --no-prerender --name=zimschool-lms
      - name: Build Cloudflare Worker
        run: npm run build:vinext --workspace=@zimschool/web
      - name: Check web role tests
        run: npm run test --workspace=@zimschool/web
      - name: Commit generated configs and pinned lockfile to migration branch
        shell: bash
        run: |
          set -euo pipefail
          for path in apps/web/package.json apps/web/vite.config.ts \
            apps/web/cloudflare.config.ts apps/web/tsconfig.json \
            apps/web/.gitignore package-lock.json .gitignore; do
            if [[ -e "$path" ]]; then git add -- "$path"; fi
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No config changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Configure Cloudflare Workers with vinext adapter"
          git push origin HEAD:deploy/cloudflare-workers-vinext
