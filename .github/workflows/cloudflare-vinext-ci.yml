name: Cloudflare Worker vinext integration
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/cloudflare-vinext-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/cloudflare-vinext-ci.yml'

permissions:
  contents: read

jobs:
  cloudflare-worker:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://mezbtcdkmvtkjxdmmhbw.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nlxCwwfA_MWEpI-3zX1hWg__PlUl91m
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check Next.js types and Supabase session logic
        run: npm run lint --workspace=@zimschool/web
      - name: Run role and application tests
        run: npm run test --workspace=@zimschool/web
      - name: Compile the Cloudflare Worker
        run: npm run build:vinext --workspace=@zimschool/web
      - name: Smoke test real local Workers runtime (demo, login, accept invite)
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run start:vinext -- --host 127.0.0.1 --port 3000 >/tmp/zimschool-cloudflare-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/demo >/tmp/zimschool-cloudflare-demo.html; then break; fi
            sleep 1
          done
          test -s /tmp/zimschool-cloudflare-demo.html || { cat /tmp/zimschool-cloudflare-preview.log; exit 1; }
          grep -q 'fictional demonstration' /tmp/zimschool-cloudflare-demo.html
          curl --fail --silent --show-error http://127.0.0.1:3000/login >/tmp/zimschool-cloudflare-login.html
          test -s /tmp/zimschool-cloudflare-login.html
          curl --fail --silent --show-error http://127.0.0.1:3000/accept-invite >/tmp/zimschool-cloudflare-invite.html
          grep -q 'Accept your school invitation' /tmp/zimschool-cloudflare-invite.html
          echo 'PASS: ZimSchool served by Cloudflare Workers local runtime'
