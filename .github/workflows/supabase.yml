name: Supabase database checks
on:
  push:
    paths: ['supabase/**', 'scripts/test-auth-smoke.mjs', 'scripts/test-phone-auth-smoke.mjs', 'scripts/test-sync-edge-smoke.mjs', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']

# Local Supabase exposes fixed ports; avoid overlapping CI runs on shared runners.
concurrency:
  group: supabase-database-validation
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Clear stale local containers
        run: supabase stop --no-backup || true
      - name: Configure local-only phone provider for CI tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/config.toml")
          config = p.read_text()
          assert "[auth.sms]" in config
          config = config.replace("[auth.sms]", "[auth.sms]\nenable_signup = true", 1)
          config += """
          [auth.sms.twilio]
          enabled = true
          account_sid = "AC00000000000000000000000000000000"
          message_service_sid = "MG00000000000000000000000000000000"
          auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"
          """
          p.write_text(config)
          PY
          echo 'SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN=CI-local-password-only-no-real-SMS' >> "$GITHUB_ENV"
      - name: Start local Supabase
        run: supabase start
      - name: Reapply migrations cleanly
        run: supabase db reset
      - name: Run pgTAP database tests
        run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Auth API and tenant-isolation smoke test
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
          SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
          node scripts/test-auth-smoke.mjs
      - name: Phone/password Auth and RLS smoke test
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
          SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
          node scripts/test-phone-auth-smoke.mjs
      - name: Real Auth JWT through local Edge API / 100 offline operations
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          supabase functions serve --no-verify-jwt > /tmp/zimschool-edge-runtime.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 4 "$API_URL/functions/v1/sync-pull" || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Edge runtime did not accept requests"
            tail -100 /tmp/zimschool-edge-runtime.log
            exit 1
          fi
          SUPABASE_URL="$API_URL" \
          SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
          SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
          node scripts/test-sync-edge-smoke.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
