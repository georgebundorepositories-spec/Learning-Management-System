name: Web authentication foundation
on:
  push:
    paths: ['apps/web/**', 'packages/shared-types/**', 'package.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/shared-types/**', 'package.json', '.github/workflows/web.yml']

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts
      - name: Type-check web app
        run: npm run lint --workspace=@zimschool/web
      - name: Run login validation tests
        run: npm run test --workspace=@zimschool/web
      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CI_only
        run: npm run build --workspace=@zimschool/web
